[package]
name = "pc-insight"
version = "1.3.0"
description = "PC Insight — характеристики компьютера"
authors = ["you"]
edition = "2021"

[lib]
name = "pc_insight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"

[profile.release]
opt-level = "s"
lto = true
strip = true
